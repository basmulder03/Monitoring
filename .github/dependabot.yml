# Keeps the dependencies current, so a published fix reaches the code through a pull request that CI checks.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      microsoft: { patterns: ["Microsoft.*", "System.*"] }
  - package-ecosystem: npm
    directory: /src/Monitoring.Ui/ui
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
