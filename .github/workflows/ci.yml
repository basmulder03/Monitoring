name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: dotnet build --configuration Release
      - name: Install the browser for the dashboard tests
        run: pwsh artifacts/Unix/bin/Monitoring.Component.Tests/release/playwright.ps1 install --with-deps chromium
      - name: Test
        run: dotnet test --configuration Release --no-build

  # Native AOT is a constraint of the design: what only breaks in the published binary (trimming, reflection, source generators) shows up here.
  aot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish the controller, the agent and the sidecar as Native AOT
        run: |
          for project in Controller Agent Sidecar; do
            dotnet publish "src/Monitoring.$project" -c Release -r linux-x64 -o "published/$project" -warnaserror
          done
      - name: Smoke test the published binaries
        run: scripts/aot-smoke.sh published
      - name: Sizes
        run: ls -l published/*/Monitoring.Controller published/*/Monitoring.Agent published/*/Monitoring.Sidecar | awk '{ print $5, $9 }'
