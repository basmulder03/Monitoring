name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A real database for the test that checks what a provider publishes.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      # A real broker for the test that checks the trace context travels through a message.
      artemis:
        image: apache/activemq-artemis:latest-alpine
        env:
          ARTEMIS_USER: art
          ARTEMIS_PASSWORD: ci-only
        ports: ["5672:5672"]
        options: >-
          --health-cmd "nc -z localhost 5672" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONITORING_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=ci-only
      MONITORING_TEST_ARTEMIS: 127.0.0.1:5672:art:ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: dotnet build --configuration Release
      - name: Install the browser for the dashboard tests
        run: pwsh artifacts/Unix/bin/Monitoring.Component.Tests/release/playwright.ps1 install --with-deps chromium
      - name: Test
        run: dotnet test --configuration Release --no-build

  # Native AOT is a constraint of the design: what only breaks in the published binary (trimming, reflection, source generators) shows up here.
  aot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish the controller, the agent, the sidecar and the injector as Native AOT
        run: |
          for project in Controller Agent Sidecar Injector; do
            dotnet publish "src/Monitoring.$project" -c Release -r linux-x64 -o "published/$project" -warnaserror
          done
      - name: Smoke test the published binaries
        run: scripts/aot-smoke.sh published
      - name: Check the start time and memory budgets
        run: scripts/budgets.sh published
      - name: Sizes
        run: ls -l published/*/Monitoring.Controller published/*/Monitoring.Agent published/*/Monitoring.Sidecar published/*/Monitoring.Injector | awk '{ print $5, $9 }'

  # The images are built, not pushed: a Dockerfile that no longer builds should fail the change that broke it.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        project: [Controller, Agent, Sidecar, Injector]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: |
          name="monitoring-$(echo '${{ matrix.project }}' | tr '[:upper:]' '[:lower:]')"
          docker build --build-arg PROJECT=${{ matrix.project }} -t "$name:ci" -f deploy/Dockerfile .
          docker images "$name:ci" --format '{{.Repository}} {{.Size}}'

  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1 --verify=false
      - name: Lint the charts, run their unit tests and check that the injector and the sidecar agree
        run: deploy/helm/test.sh

