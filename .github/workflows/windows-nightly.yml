name: Windows nightly

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The tests that read the real Service Control Manager, the real host and real named pipes skip themselves everywhere else.
      - name: Test what talks to Windows
        run: |
          dotnet test --project tests/Plover.Agent.Tests --configuration Release
          dotnet test --project tests/Plover.Client.Tests --configuration Release
          dotnet test --project tests/Plover.Component.Tests --configuration Release --filter-class "*ApplicationToControllerTests"
      # Native AOT for Windows needs the native build tools, which this runner has; a warning is a failure, as in the Linux job.
      - name: Publish the agent as Native AOT
        run: dotnet publish src/Plover.Agent -c Release -r win-x64 -o published/Agent -warnaserror
      - name: Install it as a service, kill it and remove it
        shell: pwsh
        run: deploy/windows/test-service.ps1 -Path published/Agent
