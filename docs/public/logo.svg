<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Plover">
  <title>Plover</title>
  <!-- the large shape is the application; the small bird beside it is the sidecar -->
  <rect x="8" y="30" width="76" height="76" rx="14" fill="#4c6ef5"/>
  <path d="M30 80 l12 -16 l10 8 l14 -22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- plover: round body, small head, short bill, thin legs -->
  <ellipse cx="96" cy="86" rx="22" ry="15" fill="#f1f3f5" stroke="#343a40" stroke-width="3"/>
  <path d="M76 84 q-10 2 -14 8 q10 0 16 -3z" fill="#adb5bd" stroke="#343a40" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="112" cy="70" r="10" fill="#f1f3f5" stroke="#343a40" stroke-width="3"/>
  <path d="M104 62 q8 -4 16 2" fill="none" stroke="#343a40" stroke-width="5" stroke-linecap="round"/>
  <path d="M121 71 l9 2 l-9 3z" fill="#f08c00" stroke="#f08c00" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="114" cy="68" r="2" fill="#343a40"/>
  <path d="M93 100 v16 M101 100 v16" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/>
</svg>
