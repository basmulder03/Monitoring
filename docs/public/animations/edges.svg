<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-label="Call counters travel from the library to the agent and become edges in the controller" font-family="system-ui, sans-serif" font-size="14">
<title>Call counters travel from the library to the agent and become edges in the controller</title>
<line x1="460" y1="110" x2="650" y2="110" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="80" y1="110" x2="270" y2="110" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="460" y1="110" x2="270" y2="110" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="18" y="86" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="80" y="115" text-anchor="middle" fill="#1b1f24" font-weight="600">Library</text>
<rect x="208" y="86" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="270" y="115" text-anchor="middle" fill="#1b1f24" font-weight="600">Sidecar</text>
<rect x="398" y="86" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="460" y="115" text-anchor="middle" fill="#1b1f24" font-weight="600">Agent</text>
<rect x="588" y="86" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="650" y="115" text-anchor="middle" fill="#1b1f24" font-weight="600">Controller</text>
<g opacity="0"><rect x="18" y="86" width="124" height="48" rx="8" fill="#2f9e44" opacity=".88"/><text x="80" y="115" text-anchor="middle" fill="#fff" font-weight="600">counting</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0100;0.1567;0.1667;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<text x="380.0" y="188" text-anchor="middle" fill="#6e7681" opacity="0">1. Every finished client call updates a counter: calls, errors, latency<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0200;0.1467;0.1667;1" dur="13.200000000000001s" repeatCount="indefinite"/></text>
<text x="380.0" y="188" text-anchor="middle" fill="#6e7681" opacity="0">2. The agent asks for the metrics, edges included, on a timer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1667;0.1867;0.3133;0.3333;1" dur="13.200000000000001s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#e8590c"><animate attributeName="cx" values="460;460;270;270" keyTimes="0;0.1833;0.3000;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="cy" values="110;110;110;110" keyTimes="0;0.1833;0.3000;1" dur="13.200000000000001s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#e8590c" font-weight="700"><animate attributeName="x" values="460;460;270;270" keyTimes="0;0.1833;0.3000;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="y" values="94;94;94;94" keyTimes="0;0.1833;0.3000;1" dur="13.200000000000001s" repeatCount="indefinite"/>Pull</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1667;0.1833;0.3200;0.3333;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<text x="380.0" y="188" text-anchor="middle" fill="#6e7681" opacity="0">3. The sidecar scrapes them from the library<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3533;0.4800;0.5000;1" dur="13.200000000000001s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#e8590c"><animate attributeName="cx" values="270;270;80;80" keyTimes="0;0.3500;0.4667;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="cy" values="110;110;110;110" keyTimes="0;0.3500;0.4667;1" dur="13.200000000000001s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#e8590c" font-weight="700"><animate attributeName="x" values="270;270;80;80" keyTimes="0;0.3500;0.4667;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="y" values="94;94;94;94" keyTimes="0;0.3500;0.4667;1" dur="13.200000000000001s" repeatCount="indefinite"/>Scrape</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3500;0.4867;0.5000;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<text x="380.0" y="188" text-anchor="middle" fill="#6e7681" opacity="0">4. The counters travel back; nothing was sampled<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5200;0.6467;0.6667;1" dur="13.200000000000001s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#1c7ed6"><animate attributeName="cx" values="80;80;270;270" keyTimes="0;0.5167;0.6333;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="cy" values="110;110;110;110" keyTimes="0;0.5167;0.6333;1" dur="13.200000000000001s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#1c7ed6" font-weight="700"><animate attributeName="x" values="80;80;270;270" keyTimes="0;0.5167;0.6333;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="y" values="94;94;94;94" keyTimes="0;0.5167;0.6333;1" dur="13.200000000000001s" repeatCount="indefinite"/>Edges</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5167;0.6533;0.6667;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<g opacity="0"><circle r="8" fill="#1c7ed6"><animate attributeName="cx" values="270;270;460;460" keyTimes="0;0.5167;0.6333;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="cy" values="110;110;110;110" keyTimes="0;0.5167;0.6333;1" dur="13.200000000000001s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#1c7ed6" font-weight="700"><animate attributeName="x" values="270;270;460;460" keyTimes="0;0.5167;0.6333;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="y" values="94;94;94;94" keyTimes="0;0.5167;0.6333;1" dur="13.200000000000001s" repeatCount="indefinite"/>Edges</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5167;0.6533;0.6667;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<text x="380.0" y="188" text-anchor="middle" fill="#6e7681" opacity="0">5. The agent sends them on as edges, never as spans<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6867;0.8133;0.8333;1" dur="13.200000000000001s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#2f9e44"><animate attributeName="cx" values="460;460;650;650" keyTimes="0;0.6833;0.8000;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="cy" values="110;110;110;110" keyTimes="0;0.6833;0.8000;1" dur="13.200000000000001s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#2f9e44" font-weight="700"><animate attributeName="x" values="460;460;650;650" keyTimes="0;0.6833;0.8000;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="y" values="94;94;94;94" keyTimes="0;0.6833;0.8000;1" dur="13.200000000000001s" repeatCount="indefinite"/>Edges</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6833;0.8200;0.8333;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="588" y="86" width="124" height="48" rx="8" fill="#e67700" opacity=".88"/><text x="650" y="115" text-anchor="middle" fill="#fff" font-weight="600">resolving</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8333;0.8433;0.9900;1.0000;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<text x="380.0" y="188" text-anchor="middle" fill="#6e7681" opacity="0">6. The controller resolves each callee with its registry; unknown ones become external nodes<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8333;0.8533;0.9800;1.0000;1" dur="13.200000000000001s" repeatCount="indefinite"/></text>
</svg>
