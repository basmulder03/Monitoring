<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="An instance turns unhealthy, an alert fires after its wait, and resolves when the instance recovers" font-family="system-ui, sans-serif" font-size="14">
<title>An instance turns unhealthy, an alert fires after its wait, and resolves when the instance recovers</title>
<line x1="110" y1="120" x2="380" y2="120" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="380" y1="120" x2="650" y2="50" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="650" y1="190" x2="380" y2="120" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="48" y="96" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="110" y="125" text-anchor="middle" fill="#1b1f24" font-weight="600">Agent</text>
<rect x="318" y="96" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="380" y="125" text-anchor="middle" fill="#1b1f24" font-weight="600">Controller</text>
<rect x="588" y="26" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="650" y="55" text-anchor="middle" fill="#1b1f24" font-weight="600">Dashboard</text>
<rect x="588" y="166" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="650" y="195" text-anchor="middle" fill="#1b1f24" font-weight="600">Channels</text>
<text x="380.0" y="248" text-anchor="middle" fill="#6e7681" opacity="0">1. An instance turns unhealthy: the agent sends the change<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0200;0.1800;0.2000;1" dur="11.0s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#e8590c"><animate attributeName="cx" values="110;110;380;380" keyTimes="0;0.0200;0.1600;1" dur="11.0s" repeatCount="indefinite"/><animate attributeName="cy" values="120;120;120;120" keyTimes="0;0.0200;0.1600;1" dur="11.0s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#e8590c" font-weight="700"><animate attributeName="x" values="110;110;380;380" keyTimes="0;0.0200;0.1600;1" dur="11.0s" repeatCount="indefinite"/><animate attributeName="y" values="104;104;104;104" keyTimes="0;0.0200;0.1600;1" dur="11.0s" repeatCount="indefinite"/>Delta</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0200;0.1800;0.2000;1" dur="11.0s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="318" y="96" width="124" height="48" rx="8" fill="#e67700" opacity=".88"/><text x="380" y="125" text-anchor="middle" fill="#fff" font-weight="600">waiting</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2100;0.3900;0.4000;1" dur="11.0s" repeatCount="indefinite"/></g>
<text x="380.0" y="248" text-anchor="middle" fill="#6e7681" opacity="0">2. The rule sees it, but waits (30 s by default) so a blip does not alert<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2200;0.3800;0.4000;1" dur="11.0s" repeatCount="indefinite"/></text>
<g opacity="0"><rect x="318" y="96" width="124" height="48" rx="8" fill="#c92a2a" opacity=".88"/><text x="380" y="125" text-anchor="middle" fill="#fff" font-weight="600">firing</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4100;0.5900;0.6000;1" dur="11.0s" repeatCount="indefinite"/></g>
<text x="380.0" y="248" text-anchor="middle" fill="#6e7681" opacity="0">3. Still unhealthy: the alert fires, with a stable key<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4200;0.5800;0.6000;1" dur="11.0s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#c92a2a"><animate attributeName="cx" values="380;380;650;650" keyTimes="0;0.4200;0.5600;1" dur="11.0s" repeatCount="indefinite"/><animate attributeName="cy" values="120;120;50;50" keyTimes="0;0.4200;0.5600;1" dur="11.0s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#c92a2a" font-weight="700"><animate attributeName="x" values="380;380;650;650" keyTimes="0;0.4200;0.5600;1" dur="11.0s" repeatCount="indefinite"/><animate attributeName="y" values="104;104;34;34" keyTimes="0;0.4200;0.5600;1" dur="11.0s" repeatCount="indefinite"/>Alert</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4200;0.5800;0.6000;1" dur="11.0s" repeatCount="indefinite"/></g>
<g opacity="0"><circle r="8" fill="#c92a2a"><animate attributeName="cx" values="380;380;650;650" keyTimes="0;0.4200;0.5600;1" dur="11.0s" repeatCount="indefinite"/><animate attributeName="cy" values="120;120;190;190" keyTimes="0;0.4200;0.5600;1" dur="11.0s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#c92a2a" font-weight="700"><animate attributeName="x" values="380;380;650;650" keyTimes="0;0.4200;0.5600;1" dur="11.0s" repeatCount="indefinite"/><animate attributeName="y" values="104;104;174;174" keyTimes="0;0.4200;0.5600;1" dur="11.0s" repeatCount="indefinite"/>Notify</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4200;0.5800;0.6000;1" dur="11.0s" repeatCount="indefinite"/></g>
<text x="380.0" y="248" text-anchor="middle" fill="#6e7681" opacity="0">4. The instance recovers: another delta<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6200;0.7800;0.8000;1" dur="11.0s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#2f9e44"><animate attributeName="cx" values="110;110;380;380" keyTimes="0;0.6200;0.7600;1" dur="11.0s" repeatCount="indefinite"/><animate attributeName="cy" values="120;120;120;120" keyTimes="0;0.6200;0.7600;1" dur="11.0s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#2f9e44" font-weight="700"><animate attributeName="x" values="110;110;380;380" keyTimes="0;0.6200;0.7600;1" dur="11.0s" repeatCount="indefinite"/><animate attributeName="y" values="104;104;104;104" keyTimes="0;0.6200;0.7600;1" dur="11.0s" repeatCount="indefinite"/>Delta</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6200;0.7800;0.8000;1" dur="11.0s" repeatCount="indefinite"/></g>
<text x="380.0" y="248" text-anchor="middle" fill="#6e7681" opacity="0">5. The alert resolves, in the panel and in the channels<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8000;0.8200;0.9800;1.0000;1" dur="11.0s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#2f9e44"><animate attributeName="cx" values="380;380;650;650" keyTimes="0;0.8200;0.9600;1" dur="11.0s" repeatCount="indefinite"/><animate attributeName="cy" values="120;120;50;50" keyTimes="0;0.8200;0.9600;1" dur="11.0s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#2f9e44" font-weight="700"><animate attributeName="x" values="380;380;650;650" keyTimes="0;0.8200;0.9600;1" dur="11.0s" repeatCount="indefinite"/><animate attributeName="y" values="104;104;34;34" keyTimes="0;0.8200;0.9600;1" dur="11.0s" repeatCount="indefinite"/>Resolved</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8000;0.8200;0.9800;1.0000;1" dur="11.0s" repeatCount="indefinite"/></g>
<g opacity="0"><circle r="8" fill="#2f9e44"><animate attributeName="cx" values="380;380;650;650" keyTimes="0;0.8200;0.9600;1" dur="11.0s" repeatCount="indefinite"/><animate attributeName="cy" values="120;120;190;190" keyTimes="0;0.8200;0.9600;1" dur="11.0s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#2f9e44" font-weight="700"><animate attributeName="x" values="380;380;650;650" keyTimes="0;0.8200;0.9600;1" dur="11.0s" repeatCount="indefinite"/><animate attributeName="y" values="104;104;174;174" keyTimes="0;0.8200;0.9600;1" dur="11.0s" repeatCount="indefinite"/>Resolved</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8000;0.8200;0.9800;1.0000;1" dur="11.0s" repeatCount="indefinite"/></g>
</svg>
