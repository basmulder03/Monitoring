<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="A controller replica restarts and is complete again from one snapshot" font-family="system-ui, sans-serif" font-size="14">
<title>A controller replica restarts and is complete again from one snapshot</title>
<line x1="110" y1="120" x2="600" y2="60" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="110" y1="120" x2="600" y2="190" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="48" y="96" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="110" y="125" text-anchor="middle" fill="#1b1f24" font-weight="600">Agent</text>
<rect x="538" y="36" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="600" y="65" text-anchor="middle" fill="#1b1f24" font-weight="600">Replica 1</text>
<rect x="538" y="166" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="600" y="195" text-anchor="middle" fill="#1b1f24" font-weight="600">Replica 2</text>
<text x="380.0" y="248" text-anchor="middle" fill="#6e7681" opacity="0">1. Every agent feeds all replicas<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0200;0.1467;0.1667;1" dur="13.200000000000001s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#2f9e44"><animate attributeName="cx" values="110;110;600;600" keyTimes="0;0.0167;0.1333;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="cy" values="120;120;60;60" keyTimes="0;0.0167;0.1333;1" dur="13.200000000000001s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#2f9e44" font-weight="700"><animate attributeName="x" values="110;110;600;600" keyTimes="0;0.0167;0.1333;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="y" values="104;104;44;44" keyTimes="0;0.0167;0.1333;1" dur="13.200000000000001s" repeatCount="indefinite"/>Delta</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0167;0.1533;0.1667;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<g opacity="0"><circle r="8" fill="#2f9e44"><animate attributeName="cx" values="110;110;600;600" keyTimes="0;0.0167;0.1333;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="cy" values="120;120;190;190" keyTimes="0;0.0167;0.1333;1" dur="13.200000000000001s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#2f9e44" font-weight="700"><animate attributeName="x" values="110;110;600;600" keyTimes="0;0.0167;0.1333;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="y" values="104;104;174;174" keyTimes="0;0.0167;0.1333;1" dur="13.200000000000001s" repeatCount="indefinite"/>Delta</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0167;0.1533;0.1667;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="538" y="36" width="124" height="48" rx="8" fill="#c92a2a" opacity=".88"/><text x="600" y="65" text-anchor="middle" fill="#fff" font-weight="600">restarting</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1667;0.1767;0.3233;0.3333;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<text x="380.0" y="248" text-anchor="middle" fill="#6e7681" opacity="0">2. Replica 1 restarts and loses its state; replica 2 keeps serving<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1667;0.1867;0.3133;0.3333;1" dur="13.200000000000001s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#2f9e44"><animate attributeName="cx" values="110;110;600;600" keyTimes="0;0.1833;0.3000;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="cy" values="120;120;190;190" keyTimes="0;0.1833;0.3000;1" dur="13.200000000000001s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#2f9e44" font-weight="700"><animate attributeName="x" values="110;110;600;600" keyTimes="0;0.1833;0.3000;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="y" values="104;104;174;174" keyTimes="0;0.1833;0.3000;1" dur="13.200000000000001s" repeatCount="indefinite"/>Delta</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1667;0.1833;0.3200;0.3333;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="538" y="36" width="124" height="48" rx="8" fill="#c92a2a" opacity=".88"/><text x="600" y="65" text-anchor="middle" fill="#fff" font-weight="600">empty</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3433;0.4900;0.5000;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<text x="380.0" y="248" text-anchor="middle" fill="#6e7681" opacity="0">3. The agent reconnects, with backoff and jitter<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3533;0.4800;0.5000;1" dur="13.200000000000001s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#1c7ed6"><animate attributeName="cx" values="110;110;600;600" keyTimes="0;0.3500;0.4667;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="cy" values="120;120;60;60" keyTimes="0;0.3500;0.4667;1" dur="13.200000000000001s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#1c7ed6" font-weight="700"><animate attributeName="x" values="110;110;600;600" keyTimes="0;0.3500;0.4667;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="y" values="104;104;44;44" keyTimes="0;0.3500;0.4667;1" dur="13.200000000000001s" repeatCount="indefinite"/>Hello</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3500;0.4867;0.5000;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="538" y="36" width="124" height="48" rx="8" fill="#c92a2a" opacity=".88"/><text x="600" y="65" text-anchor="middle" fill="#fff" font-weight="600">empty</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5100;0.6567;0.6667;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<text x="380.0" y="248" text-anchor="middle" fill="#6e7681" opacity="0">4. The replica answers with the configuration<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5200;0.6467;0.6667;1" dur="13.200000000000001s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#2f9e44"><animate attributeName="cx" values="600;600;110;110" keyTimes="0;0.5167;0.6333;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="cy" values="60;60;120;120" keyTimes="0;0.5167;0.6333;1" dur="13.200000000000001s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#2f9e44" font-weight="700"><animate attributeName="x" values="600;600;110;110" keyTimes="0;0.5167;0.6333;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="y" values="44;44;104;104" keyTimes="0;0.5167;0.6333;1" dur="13.200000000000001s" repeatCount="indefinite"/>Config</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5167;0.6533;0.6667;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="538" y="36" width="124" height="48" rx="8" fill="#e67700" opacity=".88"/><text x="600" y="65" text-anchor="middle" fill="#fff" font-weight="600">filling</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6767;0.8233;0.8333;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<text x="380.0" y="248" text-anchor="middle" fill="#6e7681" opacity="0">5. The agent sends its whole scope<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6867;0.8133;0.8333;1" dur="13.200000000000001s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#e8590c"><animate attributeName="cx" values="110;110;600;600" keyTimes="0;0.6833;0.8000;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="cy" values="120;120;60;60" keyTimes="0;0.6833;0.8000;1" dur="13.200000000000001s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#e8590c" font-weight="700"><animate attributeName="x" values="110;110;600;600" keyTimes="0;0.6833;0.8000;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="y" values="104;104;44;44" keyTimes="0;0.6833;0.8000;1" dur="13.200000000000001s" repeatCount="indefinite"/>Snapshot</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6833;0.8200;0.8333;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
<text x="380.0" y="248" text-anchor="middle" fill="#6e7681" opacity="0">6. The replica acknowledges; it is complete again without anyone acting<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8333;0.8533;0.9800;1.0000;1" dur="13.200000000000001s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#9c36b5"><animate attributeName="cx" values="600;600;110;110" keyTimes="0;0.8500;0.9667;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="cy" values="60;60;120;120" keyTimes="0;0.8500;0.9667;1" dur="13.200000000000001s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#9c36b5" font-weight="700"><animate attributeName="x" values="600;600;110;110" keyTimes="0;0.8500;0.9667;1" dur="13.200000000000001s" repeatCount="indefinite"/><animate attributeName="y" values="44;44;104;104" keyTimes="0;0.8500;0.9667;1" dur="13.200000000000001s" repeatCount="indefinite"/>Ack</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8333;0.8500;0.9867;1.0000;1" dur="13.200000000000001s" repeatCount="indefinite"/></g>
</svg>
