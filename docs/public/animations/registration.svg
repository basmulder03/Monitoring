<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-label="A sidecar registers, the agent collects and the controller pushes to the dashboard" font-family="system-ui, sans-serif" font-size="14">
<title>A sidecar registers, the agent collects and the controller pushes to the dashboard</title>
<line x1="275" y1="110" x2="460" y2="110" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="645" y1="110" x2="460" y2="110" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="275" y1="110" x2="90" y2="110" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="28" y="86" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="90" y="115" text-anchor="middle" fill="#1b1f24" font-weight="600">Sidecar</text>
<rect x="213" y="86" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="275" y="115" text-anchor="middle" fill="#1b1f24" font-weight="600">Agent</text>
<rect x="398" y="86" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="460" y="115" text-anchor="middle" fill="#1b1f24" font-weight="600">Controller</text>
<rect x="583" y="86" width="124" height="48" rx="8" fill="#e7eefc" stroke="#4c6ef5" stroke-width="2"/>
<text x="645" y="115" text-anchor="middle" fill="#1b1f24" font-weight="600">Browser</text>
<text x="380.0" y="188" text-anchor="middle" fill="#6e7681" opacity="0">1. The sidecar says hello: instance, service, version<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0200;0.1229;0.1429;1" dur="15.400000000000002s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#1c7ed6"><animate attributeName="cx" values="90;90;275;275" keyTimes="0;0.0143;0.1143;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="cy" values="110;110;110;110" keyTimes="0;0.0143;0.1143;1" dur="15.400000000000002s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#1c7ed6" font-weight="700"><animate attributeName="x" values="90;90;275;275" keyTimes="0;0.0143;0.1143;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="y" values="94;94;94;94" keyTimes="0;0.0143;0.1143;1" dur="15.400000000000002s" repeatCount="indefinite"/>Hello</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0143;0.1343;0.1429;1" dur="15.400000000000002s" repeatCount="indefinite"/></g>
<text x="380.0" y="188" text-anchor="middle" fill="#6e7681" opacity="0">2. The agent answers with the heartbeat interval<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1429;0.1629;0.2657;0.2857;1" dur="15.400000000000002s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#2f9e44"><animate attributeName="cx" values="275;275;90;90" keyTimes="0;0.1571;0.2571;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="cy" values="110;110;110;110" keyTimes="0;0.1571;0.2571;1" dur="15.400000000000002s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#2f9e44" font-weight="700"><animate attributeName="x" values="275;275;90;90" keyTimes="0;0.1571;0.2571;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="y" values="94;94;94;94" keyTimes="0;0.1571;0.2571;1" dur="15.400000000000002s" repeatCount="indefinite"/>Config</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1429;0.1571;0.2771;0.2857;1" dur="15.400000000000002s" repeatCount="indefinite"/></g>
<text x="380.0" y="188" text-anchor="middle" fill="#6e7681" opacity="0">3. The agent asks for the health checks<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2857;0.3057;0.4086;0.4286;1" dur="15.400000000000002s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#e8590c"><animate attributeName="cx" values="275;275;90;90" keyTimes="0;0.3000;0.4000;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="cy" values="110;110;110;110" keyTimes="0;0.3000;0.4000;1" dur="15.400000000000002s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#e8590c" font-weight="700"><animate attributeName="x" values="275;275;90;90" keyTimes="0;0.3000;0.4000;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="y" values="94;94;94;94" keyTimes="0;0.3000;0.4000;1" dur="15.400000000000002s" repeatCount="indefinite"/>Pull health</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2857;0.3000;0.4200;0.4286;1" dur="15.400000000000002s" repeatCount="indefinite"/></g>
<text x="380.0" y="188" text-anchor="middle" fill="#6e7681" opacity="0">4. The sidecar answers; the instance is now Running<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4286;0.4486;0.5514;0.5714;1" dur="15.400000000000002s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#1c7ed6"><animate attributeName="cx" values="90;90;275;275" keyTimes="0;0.4429;0.5429;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="cy" values="110;110;110;110" keyTimes="0;0.4429;0.5429;1" dur="15.400000000000002s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#1c7ed6" font-weight="700"><animate attributeName="x" values="90;90;275;275" keyTimes="0;0.4429;0.5429;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="y" values="94;94;94;94" keyTimes="0;0.4429;0.5429;1" dur="15.400000000000002s" repeatCount="indefinite"/>Health</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4286;0.4429;0.5629;0.5714;1" dur="15.400000000000002s" repeatCount="indefinite"/></g>
<text x="380.0" y="188" text-anchor="middle" fill="#6e7681" opacity="0">5. Heartbeats follow every 5 s; a changed health triggers a new pull<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5714;0.5914;0.6943;0.7143;1" dur="15.400000000000002s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#9c36b5"><animate attributeName="cx" values="90;90;275;275" keyTimes="0;0.5857;0.6857;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="cy" values="110;110;110;110" keyTimes="0;0.5857;0.6857;1" dur="15.400000000000002s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#9c36b5" font-weight="700"><animate attributeName="x" values="90;90;275;275" keyTimes="0;0.5857;0.6857;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="y" values="94;94;94;94" keyTimes="0;0.5857;0.6857;1" dur="15.400000000000002s" repeatCount="indefinite"/>Heartbeat</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5714;0.5857;0.7057;0.7143;1" dur="15.400000000000002s" repeatCount="indefinite"/></g>
<text x="380.0" y="188" text-anchor="middle" fill="#6e7681" opacity="0">6. The agent sends only what changed<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7143;0.7343;0.8371;0.8571;1" dur="15.400000000000002s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#2f9e44"><animate attributeName="cx" values="275;275;460;460" keyTimes="0;0.7286;0.8286;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="cy" values="110;110;110;110" keyTimes="0;0.7286;0.8286;1" dur="15.400000000000002s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#2f9e44" font-weight="700"><animate attributeName="x" values="275;275;460;460" keyTimes="0;0.7286;0.8286;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="y" values="94;94;94;94" keyTimes="0;0.7286;0.8286;1" dur="15.400000000000002s" repeatCount="indefinite"/>Delta</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7143;0.7286;0.8486;0.8571;1" dur="15.400000000000002s" repeatCount="indefinite"/></g>
<text x="380.0" y="188" text-anchor="middle" fill="#6e7681" opacity="0">7. The controller pushes the new overview to every open page<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8571;0.8771;0.9800;1.0000;1" dur="15.400000000000002s" repeatCount="indefinite"/></text>
<g opacity="0"><circle r="8" fill="#1c7ed6"><animate attributeName="cx" values="460;460;645;645" keyTimes="0;0.8714;0.9714;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="cy" values="110;110;110;110" keyTimes="0;0.8714;0.9714;1" dur="15.400000000000002s" repeatCount="indefinite"/></circle><text text-anchor="middle" fill="#1c7ed6" font-weight="700"><animate attributeName="x" values="460;460;645;645" keyTimes="0;0.8714;0.9714;1" dur="15.400000000000002s" repeatCount="indefinite"/><animate attributeName="y" values="94;94;94;94" keyTimes="0;0.8714;0.9714;1" dur="15.400000000000002s" repeatCount="indefinite"/>Overview</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8571;0.8714;0.9914;1.0000;1" dur="15.400000000000002s" repeatCount="indefinite"/></g>
</svg>
