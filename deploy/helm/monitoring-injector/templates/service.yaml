apiVersion: v1
kind: Service
metadata:
  name: {{ include "monitoring-injector.name" . }}
  labels: {{- include "monitoring-injector.labels" . | nindent 4 }}
  {{- if eq .Values.tls.mode "openshift" }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ include "monitoring-injector.secret" . }}
  {{- end }}
spec:
  selector: {{- include "monitoring-injector.selector" . | nindent 4 }}
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
