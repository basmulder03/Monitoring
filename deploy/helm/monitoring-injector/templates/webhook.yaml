{{- $name := include "monitoring-injector.name" . }}
{{- $ca := "" }}
{{- if eq .Values.tls.mode "generate" }}
{{- /* The certificate and the authority that signed it are made here, in the same file as the registration that has to trust it, because that is the only way to share them. */ -}}
{{- $authority := genCA (printf "%s-ca" $name) 3650 }}
{{- $cert := genSignedCert (printf "%s.%s.svc" $name .Release.Namespace) nil (list (printf "%s.%s.svc" $name .Release.Namespace) (printf "%s.%s.svc.cluster.local" $name .Release.Namespace)) 3650 $authority }}
{{- $ca = $authority.Cert | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "monitoring-injector.secret" . }}
  labels: {{- include "monitoring-injector.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $authority.Cert | b64enc }}
---
{{- end }}
# Cluster-wide, which only a cluster administrator can install. Two registrations because the selectors of one are both required: one for the namespaces that ask, one for the
# pods that ask. A pod that matches both is given the sidecar once, because the injector leaves a pod that has it alone.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $name }}-{{ .Release.Namespace }}
  labels: {{- include "monitoring-injector.labels" . | nindent 4 }}
  {{- if eq .Values.tls.mode "certManager" }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ $name }}
  {{- else if eq .Values.tls.mode "openshift" }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  {{- end }}
webhooks:
  - name: namespaces.inject.monitoring.local
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.failurePolicy }}
    timeoutSeconds: 5
    clientConfig:
      service:
        name: {{ $name }}
        namespace: {{ .Release.Namespace }}
        path: /mutate/namespace
      {{- if eq .Values.tls.mode "existingSecret" }}
      caBundle: {{ required "tls.caBundle is needed with tls.mode existingSecret" .Values.tls.caBundle }}
      {{- else if eq .Values.tls.mode "generate" }}
      caBundle: {{ $ca }}
      {{- end }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        monitoring/inject: "true"
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: {{ concat .Values.excludedNamespaces (list .Release.Namespace) | toJson }}
    # A pod can still say no.
    objectSelector:
      matchExpressions:
        - key: monitoring/inject
          operator: NotIn
          values: ["false"]
  - name: pods.inject.monitoring.local
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.failurePolicy }}
    timeoutSeconds: 5
    clientConfig:
      service:
        name: {{ $name }}
        namespace: {{ .Release.Namespace }}
        path: /mutate
      {{- if eq .Values.tls.mode "existingSecret" }}
      caBundle: {{ required "tls.caBundle is needed with tls.mode existingSecret" .Values.tls.caBundle }}
      {{- else if eq .Values.tls.mode "generate" }}
      caBundle: {{ $ca }}
      {{- end }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: {{ concat .Values.excludedNamespaces (list .Release.Namespace) | toJson }}
    objectSelector:
      matchLabels:
        monitoring/inject: "true"
