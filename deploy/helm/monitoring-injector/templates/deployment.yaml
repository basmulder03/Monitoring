apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-injector.name" . }}
  labels: {{- include "monitoring-injector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "monitoring-injector.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "monitoring-injector.selector" . | nindent 8 }}
      annotations:
        # A new certificate or a changed setting needs new pods.
        checksum/settings: {{ toYaml (dict "sidecar" .Values.sidecar "tls" .Values.tls) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: injector
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - name: webhook
              containerPort: 8443
          env:
            - name: MONITORING_Injector__SidecarImage
              value: "{{ .Values.sidecar.image.repository }}:{{ default .Chart.AppVersion .Values.sidecar.image.tag }}"
            - name: MONITORING_Injector__ImagePullPolicy
              value: {{ .Values.sidecar.imagePullPolicy | quote }}
            - name: MONITORING_Injector__AgentAddress
              value: {{ .Values.sidecar.agentAddress | quote }}
            - name: MONITORING_Injector__NativeSidecar
              value: {{ .Values.sidecar.nativeSidecar | quote }}
            {{- range $key, $value := .Values.sidecar.labels }}
            - name: MONITORING_Injector__Labels__{{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: MONITORING_Injector__Certificate
              value: /etc/injector/tls/tls.crt
            - name: MONITORING_Injector__Key
              value: /etc/injector/tls/tls.key
          readinessProbe:
            httpGet: { path: /healthz, port: webhook, scheme: HTTPS }
          livenessProbe:
            httpGet: { path: /healthz, port: webhook, scheme: HTTPS }
            initialDelaySeconds: 10
          volumeMounts:
            - name: tls
              mountPath: /etc/injector/tls
              readOnly: true
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "monitoring-injector.secret" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
