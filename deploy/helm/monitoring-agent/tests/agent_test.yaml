suite: the agent
templates: [templates/deployment.yaml, templates/serviceaccount.yaml]
set:
  controller.addresses: ["controller:9440"]
  token.existingSecret: agent-token
tests:
  - it: refuses to render without a controller address
    template: templates/deployment.yaml
    set: { controller.addresses: [] }
    asserts:
      - failedTemplate: { errorMessage: "controller.addresses needs at least one host:port" }

  - it: refuses to render without a token secret unless service accounts are used
    template: templates/deployment.yaml
    set: { token.existingSecret: "" }
    asserts:
      - failedTemplate: { errorPattern: "token.existingSecret must name a secret" }

  - it: runs once per namespace and never as root
    template: templates/deployment.yaml
    asserts:
      - isKind: { of: Deployment }
      - equal: { path: spec.replicas, value: 1 }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: "spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation", value: false }
      - equal: { path: "spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem", value: true }

  - it: reads pods in its own namespace only, with no cluster-wide rights
    template: templates/serviceaccount.yaml
    asserts:
      - isKind: { of: Role }
        documentIndex: 1
      - equal: { path: "rules[0].resources", value: [pods] }
        documentIndex: 1
      - notContains: { path: rules, content: { resources: [secrets] } }
        documentIndex: 1
      - hasDocuments: { count: 3 }

  - it: gives the agent its token from the secret
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: MONITORING_Agent__Token
            valueFrom: { secretKeyRef: { name: agent-token, key: token } }
      - notContains:
          path: "spec.template.spec.containers[0].env"
          content: { name: MONITORING_Agent__TokenFile, value: /var/run/monitoring-auth/token }
      - notExists: { path: spec.template.spec.volumes }

  - it: uses a projected token made for the controller with service account authentication
    template: templates/deployment.yaml
    set: { auth.mode: serviceAccount, auth.audience: mon, token.existingSecret: "" }
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: MONITORING_Agent__TokenFile, value: /var/run/monitoring-auth/token }
      - equal: { path: "spec.template.spec.volumes[0].projected.sources[0].serviceAccountToken.audience", value: mon }
      - notExists: { path: "spec.template.spec.containers[0].env[?(@.name=='MONITORING_Agent__Token')]" }

  - it: passes controller addresses and labels to the agent
    template: templates/deployment.yaml
    set:
      controller.addresses: ["a:1", "b:2"]
      scope.labels: { environment: prod }
    asserts:
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: MONITORING_Agent__Controllers__1, value: "b:2" } }
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: MONITORING_Agent__Labels__environment, value: prod } }

  - it: has no transport security by default
    template: templates/deployment.yaml
    asserts:
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: MONITORING_Agent__Transport__Mode, value: none } }
      - notExists: { path: spec.template.spec.volumes }
      - notExists: { path: "spec.template.spec.containers[0].volumeMounts" }

  - it: mounts the certificates for tls and also hands over the key for mtls
    template: templates/deployment.yaml
    set: { transport.mode: mtls, transport.existingSecret: certs }
    asserts:
      - equal: { path: "spec.template.spec.volumes[0].secret.secretName", value: certs }
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: MONITORING_Agent__Transport__Key, value: /etc/monitoring/transport/tls.key } }

  - it: does not hand over a key for tls
    template: templates/deployment.yaml
    set: { transport.mode: tls, transport.existingSecret: certs }
    asserts:
      - notContains:
          path: "spec.template.spec.containers[0].env"
          content: { name: MONITORING_Agent__Transport__Key, value: /etc/monitoring/transport/tls.key }

  - it: refuses tls without a secret
    template: templates/deployment.yaml
    set: { transport.mode: tls }
    asserts:
      - failedTemplate: { errorPattern: "transport.existingSecret is needed" }

  - it: matches the snapshot of its default render
    asserts:
      - matchSnapshot: {}
