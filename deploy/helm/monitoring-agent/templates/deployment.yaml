{{- if empty .Values.controller.addresses }}{{ fail "controller.addresses needs at least one host:port" }}{{ end }}
{{- if empty .Values.token.existingSecret }}{{ fail "token.existingSecret must name a secret with the agent token" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-agent.name" . }}
  labels: {{- include "monitoring-agent.labels" . | nindent 4 }}
spec:
  # One agent per namespace: after a restart it rebuilds from the pod list, and a second one would report the same scope twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "monitoring-agent.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "monitoring-agent.selector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "monitoring-agent.name" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - name: sidecars
              containerPort: 9441
          env:
            - name: MONITORING_Agent__ScopeName
              value: {{ default .Release.Namespace .Values.scope.name | quote }}
            - name: MONITORING_Agent__Token
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.token.existingSecret }}
                  key: {{ .Values.token.key }}
            {{- range $i, $address := .Values.controller.addresses }}
            - name: MONITORING_Agent__Controllers__{{ $i }}
              value: {{ $address | quote }}
            {{- end }}
            {{- range $key, $value := .Values.scope.labels }}
            - name: MONITORING_Agent__Labels__{{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: MONITORING_Agent__Discovery__Kind
              value: kubernetes
            - name: MONITORING_Agent__Discovery__Kubernetes__MonitoringSidecarContainer
              value: {{ .Values.sidecarContainer | quote }}
            - name: MONITORING_Agent__Transport__Mode
              value: {{ .Values.transport.mode | quote }}
            {{- if ne .Values.transport.mode "none" }}
            - name: MONITORING_Agent__Transport__CaFile
              value: /etc/monitoring/transport/ca.crt
            {{- if .Values.transport.serverName }}
            - name: MONITORING_Agent__Transport__ServerName
              value: {{ .Values.transport.serverName | quote }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.transport.mode "mtls" }}
            - name: MONITORING_Agent__Transport__Certificate
              value: /etc/monitoring/transport/tls.crt
            - name: MONITORING_Agent__Transport__Key
              value: /etc/monitoring/transport/tls.key
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if ne .Values.transport.mode "none" }}
          volumeMounts:
            - name: transport
              mountPath: /etc/monitoring/transport
              readOnly: true
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- if ne .Values.transport.mode "none" }}
      volumes:
        - name: transport
          secret:
            secretName: {{ required "transport.existingSecret is needed for tls and mtls" .Values.transport.existingSecret }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
