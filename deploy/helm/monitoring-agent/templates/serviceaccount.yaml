apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "monitoring-agent.name" . }}
  labels: {{- include "monitoring-agent.labels" . | nindent 4 }}
---
# The agent reads pods of its own namespace, the events about them and the workloads that own them, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "monitoring-agent.name" . }}
  labels: {{- include "monitoring-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "monitoring-agent.name" . }}
  labels: {{- include "monitoring-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "monitoring-agent.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "monitoring-agent.name" . }}
    namespace: {{ .Release.Namespace }}
