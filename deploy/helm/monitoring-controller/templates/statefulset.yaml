{{- if and (empty .Values.agentTokens) (not .Values.serviceAccountAuth.enabled) }}{{ fail "agentTokens needs at least one entry with a scope and a tokenHash, or serviceAccountAuth.enabled must be true" }}{{ end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "monitoring-controller.name" . }}
  labels: {{- include "monitoring-controller.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "monitoring-controller.name" . }}-headless
  replicas: {{ .Values.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "monitoring-controller.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "monitoring-controller.selector" . | nindent 8 }}
      annotations:
        # A new central configuration needs no restart, but a changed setting here does.
        checksum/settings: {{ toYaml (dict "tokens" .Values.agentTokens "dashboard" .Values.dashboard "aligned" .Values.alignedPackages "replicas" .Values.replicaAddresses "transport" .Values.transport "auth" .Values.serviceAccountAuth "notifications" .Values.notifications "state" .Values.state "webAuth" .Values.webAuth) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if include "monitoring-controller.needsServiceAccount" . }}
      # The controller asks the API server whether the token of an agent is valid, and holds the lease that picks the sender of alerts, as this service account.
      serviceAccountName: {{ include "monitoring-controller.name" . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - name: agents
              containerPort: 9440
            - name: web
              containerPort: 8080
          env:
            {{- range $i, $token := .Values.agentTokens }}
            - name: MONITORING_Controller__AgentTokens__{{ $i }}__Scope
              value: {{ $token.scope | quote }}
            - name: MONITORING_Controller__AgentTokens__{{ $i }}__TokenHash
              value: {{ $token.tokenHash | quote }}
            {{- end }}
            {{- if .Values.serviceAccountAuth.enabled }}
            - name: MONITORING_Controller__ServiceAccounts__Enabled
              value: "true"
            - name: MONITORING_Controller__ServiceAccounts__Audience
              value: {{ .Values.serviceAccountAuth.audience | quote }}
            {{- range $namespace, $scope := .Values.serviceAccountAuth.scopes }}
            - name: MONITORING_Controller__ServiceAccounts__Scopes__{{ $namespace }}
              value: {{ $scope | quote }}
            {{- end }}
            {{- end }}
            {{- range $i, $address := (include "monitoring-controller.replicaAddresses" . | trim | splitList "\n") }}
            - name: MONITORING_Controller__Replicas__{{ $i }}
              value: {{ $address | quote }}
            {{- end }}
            {{- if and .Values.peers.enabled (gt (int .Values.replicas) 1) }}
            {{- $name := include "monitoring-controller.name" . }}
            {{- range $i := until (int .Values.replicas) }}
            - name: MONITORING_Controller__Peers__{{ $i }}
              value: {{ printf "http://%s-%d.%s-headless.%s.svc:%d" $name $i $name $.Release.Namespace (int $.Values.service.webPort) | quote }}
            {{- end }}
            {{- with .Values.peers.existingSecret }}
            - name: MONITORING_Controller__PeerToken
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.peers.key }}
            {{- end }}
            {{- end }}
            - name: MONITORING_Controller__Configuration__File
              value: /etc/monitoring/central/central.json
            {{- range $i, $key := .Values.dashboard.groupBy }}
            - name: MONITORING_Controller__Dashboard__GroupBy__{{ $i }}
              value: {{ $key | quote }}
            {{- end }}
            {{- range $i, $rule := .Values.alignedPackages }}
            - name: MONITORING_Controller__Packages__Aligned__{{ $i }}__Package
              value: {{ $rule.package | quote }}
            - name: MONITORING_Controller__Packages__Aligned__{{ $i }}__Spread
              value: {{ default "major" $rule.spread | quote }}
            {{- end }}
            {{- if .Values.advisories.existingConfigMap }}
            - name: MONITORING_Controller__Vulnerabilities__Advisories
              value: /etc/monitoring/advisories
            {{- end }}
            {{- with .Values.advisories.fetch }}
            {{- if or .enabled .sources }}
            - name: MONITORING_Controller__Vulnerabilities__Fetch__Enabled
              value: "true"
            - name: MONITORING_Controller__Vulnerabilities__Fetch__Interval
              value: {{ .interval | quote }}
            {{- range $i, $source := .sources }}
            - name: MONITORING_Controller__Vulnerabilities__Fetch__Sources__{{ $i }}__Kind
              value: {{ required "advisories.fetch.sources needs a kind (osv or nuget)" $source.kind | quote }}
            - name: MONITORING_Controller__Vulnerabilities__Fetch__Sources__{{ $i }}__Url
              value: {{ required "advisories.fetch.sources needs a url" $source.url | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: MONITORING_Controller__Transport__Mode
              value: {{ .Values.transport.mode | quote }}
            {{- if ne .Values.transport.mode "none" }}
            - name: MONITORING_Controller__Transport__Certificate
              value: /etc/monitoring/transport/tls.crt
            - name: MONITORING_Controller__Transport__Key
              value: /etc/monitoring/transport/tls.key
            {{- end }}
            {{- if eq .Values.transport.mode "mtls" }}
            - name: MONITORING_Controller__Transport__ClientCaFile
              value: /etc/monitoring/transport/ca.crt
            {{- end }}
            - name: MONITORING_Controller__Notifications__MinSeverity
              value: {{ .Values.notifications.minSeverity | quote }}
            {{- range $i, $hook := .Values.notifications.webhooks }}
            {{- include "monitoring-controller.setting" (list (printf "MONITORING_Controller__Notifications__Webhooks__%d__Url" $i) $hook.url $hook.urlSecret) | nindent 12 }}
            {{- include "monitoring-controller.setting" (list (printf "MONITORING_Controller__Notifications__Webhooks__%d__Secret" $i) $hook.secret $hook.secretSecret) | nindent 12 }}
            {{- end }}
            {{- range $i, $chat := .Values.notifications.chats }}
            {{- include "monitoring-controller.setting" (list (printf "MONITORING_Controller__Notifications__Chats__%d__Url" $i) $chat.url $chat.urlSecret) | nindent 12 }}
            - name: MONITORING_Controller__Notifications__Chats__{{ $i }}__Format
              value: {{ default "slack" $chat.format | quote }}
            {{- end }}
            {{- with .Values.notifications.email }}
            {{- if .host }}
            - name: MONITORING_Controller__Notifications__Email__Host
              value: {{ .host | quote }}
            - name: MONITORING_Controller__Notifications__Email__Port
              value: {{ default 587 .port | quote }}
            - name: MONITORING_Controller__Notifications__Email__From
              value: {{ required "notifications.email.from is needed with a host" .from | quote }}
            {{- range $i, $to := .to }}
            - name: MONITORING_Controller__Notifications__Email__To__{{ $i }}
              value: {{ $to | quote }}
            {{- end }}
            {{- include "monitoring-controller.setting" (list "MONITORING_Controller__Notifications__Email__User" .user .userSecret) | nindent 12 }}
            {{- include "monitoring-controller.setting" (list "MONITORING_Controller__Notifications__Email__Password" "" .passwordSecret) | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- if .Values.notifications.oneSender }}
            - name: MONITORING_Controller__Notifications__Leader__Mode
              value: lease
            - name: MONITORING_Controller__Notifications__Leader__LeaseName
              value: {{ include "monitoring-controller.name" . }}-alerts
            {{- end }}
            {{- range $i, $proxy := .Values.webAuth.trustedProxies }}
            - name: MONITORING_Controller__Web__Auth__TrustedProxies__{{ $i }}
              value: {{ $proxy | quote }}
            {{- end }}
            {{- if .Values.webAuth.operatorGroup }}
            - name: MONITORING_Controller__Web__Auth__OperatorGroup
              value: {{ .Values.webAuth.operatorGroup | quote }}
            {{- end }}
            {{- range $i, $token := .Values.webAuth.tokens }}
            - name: MONITORING_Controller__Web__Auth__Tokens__{{ $i }}__Name
              value: {{ required "a dashboard token needs a name" $token.name | quote }}
            - name: MONITORING_Controller__Web__Auth__Tokens__{{ $i }}__Hash
              value: {{ required "a dashboard token needs a hash (sha-256 of the token)" $token.hash | quote }}
            - name: MONITORING_Controller__Web__Auth__Tokens__{{ $i }}__Role
              value: {{ default "viewer" $token.role | quote }}
            {{- end }}
            {{- if .Values.state.sqlite.enabled }}
            - name: MONITORING_Controller__State__SqlitePath
              value: /var/lib/monitoring/state.db
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: web }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: web }
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: central
              mountPath: /etc/monitoring/central
              readOnly: true
            {{- if ne .Values.transport.mode "none" }}
            - name: transport
              mountPath: /etc/monitoring/transport
              readOnly: true
            {{- end }}
            {{- if .Values.advisories.existingConfigMap }}
            - name: advisories
              mountPath: /etc/monitoring/advisories
              readOnly: true
            {{- end }}
            {{- if .Values.state.sqlite.enabled }}
            - name: state
              mountPath: /var/lib/monitoring
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: central
          configMap:
            name: {{ include "monitoring-controller.name" . }}
        {{- if ne .Values.transport.mode "none" }}
        - name: transport
          secret:
            secretName: {{ required "transport.existingSecret is needed for tls and mtls" .Values.transport.existingSecret }}
        {{- end }}
        {{- if .Values.advisories.existingConfigMap }}
        - name: advisories
          configMap:
            name: {{ .Values.advisories.existingConfigMap }}
        {{- end }}
        {{- if .Values.state.sqlite.enabled }}
        # Survives a restart of the container, not a reschedule of the pod.
        - name: state
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "monitoring-controller.selector" . | nindent 20 }}
        {{- end }}
