{{- if include "monitoring-controller.needsServiceAccount" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "monitoring-controller.name" . }}
  labels: {{- include "monitoring-controller.labels" . | nindent 4 }}
{{- if .Values.serviceAccountAuth.enabled }}
---
# The right to create token reviews, which is how the controller checks the token of an agent, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "monitoring-controller.name" . }}-{{ .Release.Namespace }}-auth-delegator
  labels: {{- include "monitoring-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "monitoring-controller.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.notifications.oneSender }}
---
# One replica sends alerts, chosen by holding a Lease; the right to that one object and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "monitoring-controller.name" . }}
  labels: {{- include "monitoring-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["{{ include "monitoring-controller.name" . }}-alerts"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "monitoring-controller.name" . }}
  labels: {{- include "monitoring-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "monitoring-controller.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "monitoring-controller.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
