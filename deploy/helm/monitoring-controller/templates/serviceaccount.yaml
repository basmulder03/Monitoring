{{- if .Values.serviceAccountAuth.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "monitoring-controller.name" . }}
  labels: {{- include "monitoring-controller.labels" . | nindent 4 }}
---
# The right to create token reviews, which is how the controller checks the token of an agent, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "monitoring-controller.name" . }}-{{ .Release.Namespace }}-auth-delegator
  labels: {{- include "monitoring-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "monitoring-controller.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
