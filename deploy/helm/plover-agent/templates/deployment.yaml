{{- if empty .Values.controller.addresses }}{{ fail "controller.addresses needs at least one host:port" }}{{ end }}
{{- if and (empty .Values.token.existingSecret) (ne .Values.auth.mode "serviceAccount") }}{{ fail "token.existingSecret must name a secret with the agent token, or auth.mode must be serviceAccount" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plover-agent.name" . }}
  labels: {{- include "plover-agent.labels" . | nindent 4 }}
spec:
  # One agent serves a namespace: after a restart it rebuilds from the pod list, and a second one would report the same scope twice.
  # With highAvailability the others only wait for the lease; they open no port and connect to nothing.
  {{- if .Values.highAvailability.enabled }}
  replicas: {{ .Values.highAvailability.replicas }}
  {{- else }}
  replicas: 1
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "plover-agent.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "plover-agent.selector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "plover-agent.name" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - name: sidecars
              containerPort: 9441
          env:
            - name: PLOVER_Agent__ScopeName
              value: {{ default .Release.Namespace .Values.scope.name | quote }}
            {{- if eq .Values.auth.mode "serviceAccount" }}
            - name: PLOVER_Agent__TokenFile
              value: /var/run/plover-auth/token
            {{- else }}
            - name: PLOVER_Agent__Token
              valueFrom:
                secretKeyRef:
                  name: {{ required "token.existingSecret is needed with auth.mode token" .Values.token.existingSecret }}
                  key: {{ .Values.token.key }}
            {{- end }}
            {{- range $i, $address := .Values.controller.addresses }}
            - name: PLOVER_Agent__Controllers__{{ $i }}
              value: {{ $address | quote }}
            {{- end }}
            {{- range $key, $value := .Values.scope.labels }}
            - name: PLOVER_Agent__Labels__{{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if not .Values.sidecars.verifyPeerAddress }}
            - name: PLOVER_Agent__Sidecars__VerifyPeerAddress
              value: "false"
            {{- end }}
            - name: PLOVER_Agent__Discovery__Kind
              value: kubernetes
            {{- if .Values.highAvailability.enabled }}
            - name: PLOVER_Agent__Discovery__Kubernetes__LeaderElection__Enabled
              value: "true"
            - name: PLOVER_Agent__Discovery__Kubernetes__LeaderElection__LeaseName
              value: {{ include "plover-agent.name" . | quote }}
            {{- end }}
            - name: PLOVER_Agent__Discovery__Kubernetes__PloverSidecarContainer
              value: {{ .Values.sidecarContainer | quote }}
            {{- if .Values.podMetrics }}
            - name: PLOVER_Agent__Discovery__Kubernetes__PodMetrics
              value: "true"
            {{- end }}
            - name: PLOVER_Agent__Transport__Mode
              value: {{ .Values.transport.mode | quote }}
            {{- if ne .Values.transport.mode "none" }}
            - name: PLOVER_Agent__Transport__CaFile
              value: /etc/plover/transport/ca.crt
            {{- if .Values.transport.serverName }}
            - name: PLOVER_Agent__Transport__ServerName
              value: {{ .Values.transport.serverName | quote }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.transport.mode "mtls" }}
            - name: PLOVER_Agent__Transport__Certificate
              value: /etc/plover/transport/tls.crt
            - name: PLOVER_Agent__Transport__Key
              value: /etc/plover/transport/tls.key
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or (ne .Values.transport.mode "none") (eq .Values.auth.mode "serviceAccount") }}
          volumeMounts:
            {{- if ne .Values.transport.mode "none" }}
            - name: transport
              mountPath: /etc/plover/transport
              readOnly: true
            {{- end }}
            {{- if eq .Values.auth.mode "serviceAccount" }}
            - name: plover-auth
              mountPath: /var/run/plover-auth
              readOnly: true
            {{- end }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- if or (ne .Values.transport.mode "none") (eq .Values.auth.mode "serviceAccount") }}
      volumes:
        {{- if ne .Values.transport.mode "none" }}
        - name: transport
          secret:
            secretName: {{ required "transport.existingSecret is needed for tls and mtls" .Values.transport.existingSecret }}
        {{- end }}
        {{- if eq .Values.auth.mode "serviceAccount" }}
        # A token made for the controller alone, short-lived and rotated by Kubernetes; the token of the service account itself is not used.
        - name: plover-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.auth.audience | quote }}
                  expirationSeconds: 3600
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
